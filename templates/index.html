<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Agentic RAG Assistant - Endee Powered</title>

    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #333;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            padding: 30px;
            background: white;
            min-height: 100vh;
            box-shadow: 0px 0px 40px rgba(0,0,0,0.2);
            border-radius: 12px;
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
            color: #444;
        }

        h3 {
            margin-top: 30px;
            color: #555;
        }

        input[type="file"],
        input[type="text"] {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 15px;
        }

        button {
            margin-top: 10px;
            padding: 10px 18px;
            border-radius: 8px;
            border: none;
            background: #667eea;
            color: white;
            cursor: pointer;
            font-size: 15px;
            transition: 0.3s;
        }

        button:hover {
            background: #556cd6;
        }

        .message {
            margin-top: 10px;
            color: green;
            font-weight: 500;
        }

        .chat-history {
            margin-top: 30px;
            display: flex;
            flex-direction: column;
        }

        .bubble {
            padding: 14px 18px;
            border-radius: 14px;
            margin-bottom: 15px;
            max-width: 75%;
            font-size: 15px;
            line-height: 1.5;
        }

        .user {
            background: #e8eaf6;
            align-self: flex-end;
            margin-left: auto;
        }

        .bot {
            background: #f3e8ff;
            align-self: flex-start;
            margin-right: auto;
        }

        .header-sub {
            text-align: center;
            color: #777;
            font-size: 14px;
            margin-bottom: 30px;
        }

        hr {
            margin-top: 30px;
            margin-bottom: 30px;
            border: 0;
            height: 1px;
            background: #ddd;
        }
    </style>
</head>

<body>
<div class="container">

    <h1>🚀 Agentic RAG Assistant</h1>
    <div class="header-sub">
        Powered by Endee Vector Database + Local Mistral LLM
    </div>

    <!-- Upload Section -->
    <h3>📄 Upload Knowledge (PDF)</h3>
    <form method="post" enctype="multipart/form-data">
        <input type="file" name="document">
        <button type="submit">Upload & Index</button>
    </form>

    {% if message %}
        <div class="message">{{ message }}</div>
    {% endif %}

    <hr>

    <!-- Ask Section -->
    <h3>💬 Ask Questions</h3>
    <form method="post">
        <input type="text" name="question"
               placeholder="Ask something about the uploaded documents..."
               required>
        <button type="submit">Ask</button>
    </form>

    <!-- Chat History -->
    <div class="chat-history">
        {% for item in history %}
            <div class="bubble user">
                <strong>You:</strong><br>
                {{ item.question }}
            </div>
            <div class="bubble bot">
                <strong>AI:</strong><br>
                {{ item.answer }}
            </div>
        {% endfor %}
    </div>

</div>

<script>
    const forms = document.querySelectorAll("form");
    forms.forEach(form => {
        form.addEventListener("submit", () => {
            document.body.style.cursor = "wait";
        });
    });
</script>

</body>
</html>
